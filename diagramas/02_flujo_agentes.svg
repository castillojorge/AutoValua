<svg width="900" height="620" viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#475569" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#db2777" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="900" height="620" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="19" font-weight="600" fill="#0f172a">Flujo de agentes — ciclo de una consulta</text>
  <text x="450" y="54" text-anchor="middle" font-size="12.5" fill="#64748b">Observar → Analizar → Planificar → Actuar → Evaluar → Aprender</text>

  <!-- Usuario -->
  <rect x="380" y="76" width="140" height="46" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>
  <text x="450" y="104" text-anchor="middle" font-size="12.5" font-weight="600" fill="#334155">Usuario consulta</text>
  <line x1="450" y1="122" x2="450" y2="150" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow2)"/>

  <!-- 1 Observar -->
  <g>
    <rect x="350" y="154" width="200" height="46" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="450" y="172" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a8a">1. Observación</text>
    <text x="450" y="188" text-anchor="middle" font-size="10" fill="#1e40af">Recibe la pregunta (chat/API)</text>
  </g>
  <line x1="450" y1="200" x2="450" y2="228" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow2)"/>

  <!-- 2 Analizar -->
  <g>
    <rect x="350" y="232" width="200" height="46" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="450" y="250" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a8a">2. Análisis</text>
    <text x="450" y="266" text-anchor="middle" font-size="10" fill="#1e40af">¿Coincidencia exacta o alias?</text>
  </g>
  <line x1="450" y1="278" x2="450" y2="306" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow2)"/>

  <!-- 3 Planificar -->
  <g>
    <rect x="340" y="310" width="220" height="52" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="450" y="328" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a8a">3. Planificación</text>
    <text x="450" y="344" text-anchor="middle" font-size="10" fill="#1e40af">Elige estrategia: fuzzy marca+modelo,</text>
    <text x="450" y="357" text-anchor="middle" font-size="10" fill="#1e40af">luego fuzzy solo-modelo si falla</text>
  </g>
  <line x1="450" y1="362" x2="450" y2="390" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow2)"/>

  <!-- 4 Actuar -->
  <g>
    <rect x="350" y="394" width="200" height="46" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="450" y="412" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a8a">4. Acción</text>
    <text x="450" y="428" text-anchor="middle" font-size="10" fill="#1e40af">Ejecuta la búsqueda elegida</text>
  </g>
  <line x1="450" y1="440" x2="450" y2="468" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow2)"/>

  <!-- 5 Evaluar (decision diamond) -->
  <polygon points="450,470 560,510 450,550 340,510" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.2"/>
  <text x="450" y="504" text-anchor="middle" font-size="11.5" font-weight="600" fill="#713f12">5. Evaluación</text>
  <text x="450" y="519" text-anchor="middle" font-size="9.5" fill="#854d0e">¿Confianza ≥ 80?</text>

  <!-- SI -> responde -->
  <line x1="560" y1="510" x2="660" y2="510" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arrow2)"/>
  <text x="605" y="500" text-anchor="middle" font-size="10" fill="#15803d" font-weight="600">SI</text>
  <rect x="665" y="484" width="180" height="52" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
  <text x="755" y="504" text-anchor="middle" font-size="11.5" font-weight="600" fill="#14532d">Responde al usuario</text>
  <text x="755" y="519" text-anchor="middle" font-size="9.5" fill="#166534">valor + nota legal</text>

  <!-- NO -> vuelve a planificar (nueva estrategia) -->
  <path d="M340 510 C 260 510, 260 336, 340 336" fill="none" stroke="#db2777" stroke-width="1.6" marker-end="url(#arrowRed)"/>
  <text x="248" y="428" text-anchor="middle" font-size="10" fill="#9d174d" font-weight="600" transform="rotate(-90 248 428)">NO — otra estrategia</text>

  <!-- Escalado -->
  <line x1="450" y1="550" x2="450" y2="578" stroke="#db2777" stroke-width="1.6" marker-end="url(#arrowRed)"/>
  <text x="472" y="568" font-size="9.5" fill="#9d174d">tras 2 intentos</text>
  <rect x="330" y="582" width="240" height="30" rx="8" fill="#fdf2f8" stroke="#db2777" stroke-width="1.2"/>
  <text x="450" y="601" text-anchor="middle" font-size="11" font-weight="600" fill="#831843">Escalar a equipo humano (caso + candidatos)</text>

  <!-- Aprendizaje loop (dashed, right side): humano resuelve -> alias queda en memoria -> futuras consultas matchean en el paso de Análisis -->
  <path d="M570 597 C 790 597, 790 260, 552 254" fill="none" stroke="#7c3aed" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow2)"/>
  <text x="805" y="430" text-anchor="middle" font-size="9.5" fill="#6d28d9" transform="rotate(90 805 430)">6. Aprendizaje</text>
  <text x="740" y="200" text-anchor="middle" font-size="9.5" fill="#6d28d9">Alias resuelto por humano se</text>
  <text x="740" y="214" text-anchor="middle" font-size="9.5" fill="#6d28d9">guarda en memoria procedimental</text>
  <text x="740" y="228" text-anchor="middle" font-size="9.5" fill="#6d28d9">→ próxima consulta igual, match directo</text>

  <text x="450" y="608" text-anchor="middle" font-size="0" fill="none"></text>
  <text x="450" y="600" text-anchor="middle" font-size="0" fill="none"></text>
  <text x="450" y="655" text-anchor="middle" font-size="10.5" fill="#94a3b8">Figura 2 — Ciclo de decisión aplicado a una consulta: cambio de estrategia, escalado a humano y aprendizaje procedimental</text>
</svg>
