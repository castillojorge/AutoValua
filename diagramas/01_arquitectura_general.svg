<svg width="900" height="760" viewBox="0 0 900 760" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#475569" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="900" height="760" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="19" font-weight="600" fill="#0f172a">Arquitectura general — AutoValúa AI</text>
  <text x="450" y="54" text-anchor="middle" font-size="12.5" fill="#64748b">Flujo de datos, capas de memoria y canales de exposición</text>

  <!-- Legend -->
  <g font-size="11" fill="#334155">
    <rect x="360" y="672" width="12" height="12" rx="2" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
    <text x="378" y="682">Componente de IA</text>
    <rect x="500" y="672" width="12" height="12" rx="2" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
    <text x="518" y="682">Lógica tradicional</text>
  </g>

  <!-- Fuente externa -->
  <rect x="330" y="76" width="240" height="50" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>
  <text x="450" y="97" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">Portal DNRPA</text>
  <text x="450" y="114" text-anchor="middle" font-size="11" fill="#64748b">PDF mensual, ~212 páginas</text>

  <line x1="450" y1="126" x2="450" y2="156" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- Capa de ingesta -->
  <rect x="90" y="160" width="720" height="90" rx="12" fill="#fafafa" stroke="#cbd5e1" stroke-width="1"/>
  <text x="106" y="178" font-size="11.5" font-weight="600" fill="#64748b">CAPA DE INGESTA</text>

  <g>
    <rect x="120" y="188" width="180" height="52" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="1.2"/>
    <text x="210" y="208" text-anchor="middle" font-size="12.5" font-weight="600" fill="#334155">Agente Scraper</text>
    <text x="210" y="224" text-anchor="middle" font-size="10.5" fill="#64748b">Detecta tabla nueva</text>
  </g>
  <line x1="300" y1="214" x2="340" y2="214" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>
  <g>
    <rect x="345" y="188" width="180" height="52" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="435" y="208" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e3a8a">Agente Ingestor</text>
    <text x="435" y="224" text-anchor="middle" font-size="10.5" fill="#1e40af">Parseo a estructura normalizada</text>
  </g>
  <line x1="525" y1="214" x2="565" y2="214" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>
  <g>
    <rect x="570" y="188" width="210" height="52" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="675" y="205" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e3a8a">Agente Validador</text>
    <text x="675" y="221" text-anchor="middle" font-size="10.5" fill="#1e40af">z-score vs. media de mercado</text>
    <text x="675" y="234" text-anchor="middle" font-size="10.5" fill="#1e40af">escala anomalías a humano</text>
  </g>

  <line x1="450" y1="250" x2="450" y2="280" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- Memoria persistente -->
  <rect x="60" y="284" width="780" height="110" rx="12" fill="#fefce8" stroke="#eab308" stroke-width="1"/>
  <text x="76" y="302" font-size="11.5" font-weight="600" fill="#a16207">MEMORIA PERSISTENTE (SQLite)</text>

  <g>
    <rect x="90" y="312" width="165" height="66" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1"/>
    <text x="172" y="336" text-anchor="middle" font-size="12" font-weight="600" fill="#713f12">Semántica</text>
    <text x="172" y="352" text-anchor="middle" font-size="10" fill="#854d0e">Tablas de vigencias</text>
    <text x="172" y="365" text-anchor="middle" font-size="10" fill="#854d0e">ingeridas</text>
  </g>
  <g>
    <rect x="270" y="312" width="165" height="66" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1"/>
    <text x="352" y="336" text-anchor="middle" font-size="12" font-weight="600" fill="#713f12">Episódica</text>
    <text x="352" y="352" text-anchor="middle" font-size="10" fill="#854d0e">Historial de consultas</text>
    <text x="352" y="365" text-anchor="middle" font-size="10" fill="#854d0e">por usuario</text>
  </g>
  <g>
    <rect x="450" y="312" width="165" height="66" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1"/>
    <text x="532" y="336" text-anchor="middle" font-size="12" font-weight="600" fill="#713f12">Procedimental</text>
    <text x="532" y="352" text-anchor="middle" font-size="10" fill="#854d0e">Alias aprendidos de</text>
    <text x="532" y="365" text-anchor="middle" font-size="10" fill="#854d0e">casos escalados</text>
  </g>
  <g>
    <rect x="630" y="312" width="165" height="66" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1"/>
    <text x="712" y="336" text-anchor="middle" font-size="12" font-weight="600" fill="#713f12">Notificaciones</text>
    <text x="712" y="352" text-anchor="middle" font-size="10" fill="#854d0e">Preferencias de aviso</text>
    <text x="712" y="365" text-anchor="middle" font-size="10" fill="#854d0e">por usuario</text>
  </g>

  <line x1="450" y1="394" x2="450" y2="424" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- Capa de consulta agentica -->
  <rect x="90" y="428" width="720" height="90" rx="12" fill="#fafafa" stroke="#cbd5e1" stroke-width="1"/>
  <text x="106" y="446" font-size="11.5" font-weight="600" fill="#64748b">CAPA DE CONSULTA AGÉNTICA</text>

  <g>
    <rect x="120" y="456" width="220" height="52" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="230" y="474" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e3a8a">Agente Consulta/Matching</text>
    <text x="230" y="490" text-anchor="middle" font-size="10.5" fill="#1e40af">Fuzzy search + umbrales</text>
  </g>
  <g>
    <rect x="360" y="456" width="200" height="52" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="460" y="474" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e3a8a">Agente Analista Histórico</text>
    <text x="460" y="490" text-anchor="middle" font-size="10.5" fill="#1e40af">Series temporales</text>
  </g>
  <g>
    <rect x="580" y="456" width="200" height="52" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.2"/>
    <text x="680" y="474" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e3a8a">Agente Notificador</text>
    <text x="680" y="490" text-anchor="middle" font-size="10.5" fill="#1e40af">Alertas de cambio de valor</text>
  </g>

  <line x1="450" y1="518" x2="450" y2="548" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>

  <!-- Canales -->
  <g>
    <rect x="150" y="552" width="280" height="60" rx="10" fill="#e2e8f0" stroke="#64748b" stroke-width="1.2"/>
    <text x="290" y="577" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">Chatbot (web / mensajería)</text>
    <text x="290" y="595" text-anchor="middle" font-size="10.5" fill="#64748b">Público, sin autenticación</text>
  </g>
  <g>
    <rect x="470" y="552" width="280" height="60" rx="10" fill="#e2e8f0" stroke="#64748b" stroke-width="1.2"/>
    <text x="610" y="577" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">API REST</text>
    <text x="610" y="595" text-anchor="middle" font-size="10.5" fill="#64748b">Autenticada — header X-API-Key</text>
  </g>

  <line x1="290" y1="612" x2="290" y2="638" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>
  <line x1="610" y1="612" x2="610" y2="638" stroke="#475569" stroke-width="1.4" marker-end="url(#arrow)"/>

  <text x="290" y="656" text-anchor="middle" font-size="12" fill="#334155">Usuario particular</text>
  <text x="610" y="656" text-anchor="middle" font-size="12" fill="#334155">Aseguradoras · gestorías · tasadores</text>

  <!-- Panel humano -->
  <line x1="675" y1="240" x2="820" y2="240" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="230" y1="508" x2="820" y2="508" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="820" y1="240" x2="820" y2="508" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3"/>
  <rect x="810" y="330" width="70" height="90" rx="8" fill="#fdf2f8" stroke="#db2777" stroke-width="1.2"/>
  <text x="845" y="365" text-anchor="middle" font-size="10.5" font-weight="600" fill="#831843">Equipo</text>
  <text x="845" y="378" text-anchor="middle" font-size="10.5" font-weight="600" fill="#831843">humano</text>
  <text x="845" y="394" text-anchor="middle" font-size="9.5" fill="#9d174d">(escalados)</text>

  <text x="450" y="700" text-anchor="middle" font-size="10.5" fill="#94a3b8">Figura 1 — Arquitectura general: ingesta, memoria persistente, agentes de consulta y canales de exposición</text>
</svg>
